[General]
network = carla.CarlaWorld
sim-time-limit = 0.5s
cmdenv-express-mode = false
debug-on-errors = true

**.vector-recording = false
**.scalar-recording = true

# CARLA server to connect to (override with -u*-cmdenv args or edit here)
*.carlaHost = "big-boss.tail4b138a.ts.net"
*.carlaPort = 2000
*.carlaManager.timeout = 15s

# lock-step co-simulation: one CARLA frame per 10 ms of simulation time
*.carlaManager.synchronousMode = true
*.carlaManager.stepInterval = 0.01s   # CARLA accepts at most 1/60 s
*.carlaManager.sensorWaitTimeout = 0.05s

# ego vehicle and its sensors
*.carlaManager.spawnEgoVehicle = true
*.carlaManager.vehicleBlueprint = "vehicle.tesla.model3"
*.carlaManager.autopilot = true
*.carlaManager.sensors = "sensor.other.gnss:100;sensor.other.imu:100;sensor.other.collision"

sink.printReadings = true
