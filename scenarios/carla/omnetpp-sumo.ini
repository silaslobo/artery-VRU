# Combined synchronized scenario: SUMO (traffic master) + CARLA (sensor
# world) running the generated intersection from scenarios/carla/maps.
#
#   cmake --build build --target run_carla_sumo_scenario
#
# One SUMO step == one CARLA frame == 10 ms of simulation time.  Every SUMO
# vehicle is mirrored onto a kinematic CARLA avatar (carla.CarlaAvatar) right
# before World::Tick(); the residual between the requested and the actual
# CARLA pose is recorded as sync.geometryResidual.

[General]
network = carla.CarlaSumoWorld
sim-time-limit = 1s
cmdenv-express-mode = false
debug-on-errors = true

**.vector-recording = false
**.scalar-recording = true

# --- CARLA (sensor world) ---
*.carlaHost = "big-boss.tail4b138a.ts.net"
*.carlaPort = 2000
*.carlaManager.timeout = 60s          # world generation over the WAN is slow
*.carlaManager.stepInterval = 0.01s   # == SUMO step-length, max 1/60 s
# how long a tick waits for the sensor data of the frame it just ticked;
# streaming one 1280x720 frame over the WAN takes ~2 s, shorter values
# would deliver the measurements of a frame one or more ticks late
# (they are still attributed to the correct simulation instant)
*.carlaManager.sensorWaitTimeout = 2s

# generated map (tools/carla_map/gen_xodr.py)
*.carlaManager.opendriveFile = "maps/intersection.xodr"
*.carlaManager.mapCheckFile = "maps/intersection.xodr.lanepoints"
# geometry-accurate mesh so the CARLA world matches the SUMO lanes
*.carlaManager.vertexDistance = 0.2
*.carlaManager.additionalWidth = 0.0
*.carlaManager.simplificationPercentage = 0
*.carlaManager.smoothJunctions = false
*.carlaManager.wallHeight = 0.0

# one fixed observation camera (manager-level sensor offsets are absolute
# CARLA world coordinates): high oblique view from south of the
# junction (arms are only 18 m long; both cars roll in at the posted speed
# and reach the junction within ~1 s; the south one turns left, the east one
# goes straight).
# the camera delivers one image per world tick (heavy over a WAN, but it is
# what a synchronous CV consumer needs -- throttle by dropping arrivals on
# the consumer side)
*.carlaManager.sensors = "sensor.camera.rgb@0,-38,30,-55,90,0!image_size_x=1280,image_size_y=720,fov=90"
# pose residual per avatar and frame
*.carlaManager.avatarResidualCheck = true
# one rgb camera on the second vehicle only (front windshield; avatar sensor
# offsets are vehicle-local, x=fore); nodes are created in departure order,
# so node[1] is v_e10_to_e15_1. All other avatars keep the NED default "".
# image_size_x/image_size_y are the correct blueprint attribute names
*.node[1].carlaAvatar.sensors = "sensor.camera.rgb@1.8,0,1.7,0,0,0!image_size_x=1280,image_size_y=720,fov=90"
# raw pixel bytes are required by carla.CarlaImageSink (PNG captures)
*.carlaManager.copySensorPayload = true

# --- SUMO (traffic master) ---
*.traci.core.version = -1
*.traci.core.selfStopping = false
