[General]
sim-time-limit = 86400 s
warmup-period = 0 s
debug-on-errors = true
print-undisposed = true

cmdenv-express-mode = true
cmdenv-autoflush = true

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "cyclists.sumocfg"

*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"


#**.ChannelLoad:vector.vector-recording = true
#**.Cam2Mac:vector.vector-recording = true
#**.VamSentCounter:vector.vector-recording = true
#**.packetErrorRate:vector.vector-recording = true
#**.radioChannel:vector.vector-recording = true
#**.LinkLatency:vector.vector-recording = true
#**.delayDcc:vector.vector-recording = true
**.vector-recording = false
**.result-recording-modes = all
**.scalar-recording = true
**.PositionTrigger:vector.vector-recording = true
**.HeadingTrigger:vector.vector-recording = true
**.SpeedTrigger:vector.vector-recording = true

*.radioMedium.pathLossType = "VanetNakagamiFading"
*.radioMedium.pathLoss.withSmallScaleVariations = false
*.radioMedium.pathLoss.withVisualization = true

#mib.vanetzaDisableBeaconing = true

#DCC
*.node[*].vanetza[*].dcc.typename = "LimericDccEntity"
*.node[*].vanetza[*].dcc.enableDualAlpha = true

# separate random number generator for vehicle penetration rate
num-rngs = 5
*.traci.mapper.rng-0 = 1
seed-1-mt = ${seed=0}#, 23, 42, 1337, 0815, 4711}

*.withObstacles = true
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

*.node[*].*.parseID = true

network = artery.inet.World

*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].middleware.services = xmldoc("services.xml")


*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2022-05-05 10:00:00"
*.node[*].middleware.CaService.fixedRate = false

#**.VruStationID:vector.vector-recording = true

**.MessageSize:vector.vector-recording = false

World.traci.ignorePersons = false

[Config sumo-gui]
*.traci.launcher.sumo = "sumo-gui"
